<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOCALZIP Partner App</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], heading: ['Poppins', 'sans-serif'] },
                    colors: { primary: '#0c831f', primaryDark: '#0a6b18', secondary: '#f8cb46' }
                }
            }
        }
    </script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen pb-20">

    <!-- Toast Notifications -->
    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 pointer-events-none w-full max-w-sm px-4"></div>

    <!-- Login Screen -->
    <div id="auth-screen" class="fixed inset-0 bg-gray-900 z-50 flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md border border-gray-100 text-center">
            <div class="w-20 h-20 bg-primary/10 text-primary rounded-full flex items-center justify-center text-4xl mx-auto mb-6 shadow-sm">
                <i class="fas fa-motorcycle"></i>
            </div>
            <h2 class="text-2xl font-heading font-bold text-gray-900 mb-2">Partner Login</h2>
            <p class="text-gray-500 mb-8 text-sm">Enter your registered mobile number & password.</p>
            
            <form onsubmit="handlePartnerLogin(event)" class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Mobile Number *</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 font-bold">+91</span>
                        <input type="tel" id="partner-phone" required placeholder="10-digit mobile number" class="w-full bg-gray-50 border border-gray-200 rounded-xl py-3.5 pl-14 pr-4 outline-none focus:border-primary font-bold text-sm" maxlength="10">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Password *</label>
                    <input type="password" id="partner-password" required placeholder="••••••••" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3.5 outline-none focus:border-primary font-bold text-sm">
                </div>
                <button type="submit" id="login-btn" class="w-full bg-primary hover:bg-primaryDark text-white py-4 rounded-xl font-bold shadow-lg shadow-primary/30 transition-all text-base mt-2 flex justify-center items-center gap-2">
                    Login to App <i class="fas fa-arrow-right"></i>
                </button>
            </form>
            <p class="text-[11px] text-gray-400 mt-6 text-center">Contact Admin if you forgot your credentials</p>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard" class="hidden max-w-md mx-auto relative h-screen flex flex-col">
        <!-- Header -->
        <div class="bg-white p-4 shadow-sm border-b border-gray-200 flex justify-between items-center z-10">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-primary/10 text-primary rounded-full flex items-center justify-center font-bold text-xl">
                    <i class="fas fa-motorcycle"></i>
                </div>
                <div>
                    <span id="partner-display-name" class="font-heading font-extrabold text-base text-gray-900">Partner App</span>
                    <div id="partner-display-phone" class="text-[10px] font-bold text-gray-500">Active Delivery Agent</div>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="handlePartnerLogout()" class="text-xs bg-red-50 text-red-600 hover:bg-red-600 hover:text-white px-2.5 py-1.5 rounded-lg font-bold border border-red-200 transition-colors">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>

        <!-- View Toggle -->
        <div class="bg-white px-4 pt-2 border-b border-gray-200 flex gap-6">
            <button onclick="switchTab('new')" id="tab-new" class="pb-3 text-sm font-bold text-primary border-b-2 border-primary flex-1 transition-all">New Requests <span id="badge-new" class="ml-1 bg-red-500 text-white text-[10px] px-1.5 py-0.5 rounded-full hidden">0</span></button>
            <button onclick="switchTab('active')" id="tab-active" class="pb-3 text-sm font-bold text-gray-500 border-b-2 border-transparent flex-1 transition-all">My Deliveries <span id="badge-active" class="ml-1 bg-primary text-white text-[10px] px-1.5 py-0.5 rounded-full hidden">0</span></button>
        </div>

        <!-- Content Area -->
        <div class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50 custom-scrollbar pb-32" id="content-area"></div>

        <!-- Bottom Status Bar -->
        <div class="fixed bottom-0 w-full max-w-md bg-white border-t border-gray-200 p-4 pb-safe flex justify-between items-center text-xs text-gray-500 font-medium z-10 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
            <span class="flex items-center gap-1.5 text-emerald-600 font-bold"><i class="fas fa-satellite-dish animate-pulse"></i> Live GPS Telemetry Active</span>
            <button onclick="location.reload()" class="text-primary font-bold"><i class="fas fa-sync-alt"></i> Refresh</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, setDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAZA70bgxqeMsRMP1ri6B_FNLyD5CZA3fc",
            authDomain: "localzip.firebaseapp.com",
            projectId: "localzip",
            storageBucket: "localzip.firebasestorage.app",
            messagingSenderId: "593061380454",
            appId: "1:593061380454:web:c7c0558e52e4b7897488a7"
        };
        const app_id = 'localzip';
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentRider = null;
        let allOrders = [];
        let currentTab = 'new';
        let watchId = null;
        let activeTrackingOrderId = null;

        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const color = type === 'success' ? 'bg-emerald-600' : 'bg-red-600';
            toast.className = `${color} text-white px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 font-bold text-xs`;
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle'}"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }

        window.handlePartnerLogin = async function(e) {
            e.preventDefault();
            const phone = document.getElementById('partner-phone').value.trim();
            const password = document.getElementById('partner-password').value.trim();

            const btn = document.getElementById('login-btn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
            btn.disabled = true;

            try {
                const snap = await getDocs(collection(db, 'artifacts', app_id, 'public', 'data', 'deliveryPartners'));
                const riders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                const match = riders.find(r => r.phone === phone && r.password === password);

                if (match) {
                    currentRider = match;
                    localStorage.setItem('lz_rider_session', JSON.stringify(match));
                    document.getElementById('partner-display-name').textContent = match.name || 'Partner Agent';
                    document.getElementById('partner-display-phone').textContent = `+91 ${match.phone}`;
                    
                    document.getElementById('auth-screen').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    setupOrdersListener();
                    showToast(`Welcome back, ${match.name}!`);
                } else {
                    showToast("Invalid Mobile Number or Password.", "error");
                }
            } catch (err) {
                console.error(err);
                showToast("Login error. Check network.", "error");
            } finally {
                btn.innerHTML = 'Login to App <i class="fas fa-arrow-right"></i>';
                btn.disabled = false;
            }
        }

        window.handlePartnerLogout = function() {
            stopLocationTracking();
            localStorage.removeItem('lz_rider_session');
            currentRider = null;
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
            showToast("Logged out successfully");
        }

        function checkSession() {
            const saved = localStorage.getItem('lz_rider_session');
            if (saved) {
                try {
                    currentRider = JSON.parse(saved);
                    document.getElementById('partner-display-name').textContent = currentRider.name || 'Partner Agent';
                    document.getElementById('partner-display-phone').textContent = `+91 ${currentRider.phone}`;
                    document.getElementById('auth-screen').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    setupOrdersListener();
                } catch(e) {
                    localStorage.removeItem('lz_rider_session');
                }
            }
        }

        function setupOrdersListener() {
            const ordersRef = collection(db, 'artifacts', app_id, 'public', 'data', 'orders');
            onSnapshot(ordersRef, (snapshot) => {
                allOrders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderContent();
            });
        }

        window.switchTab = function(tab) {
            currentTab = tab;
            document.getElementById('tab-new').className = tab === 'new' ? "pb-3 text-sm font-bold text-primary border-b-2 border-primary flex-1 transition-all" : "pb-3 text-sm font-bold text-gray-500 border-b-2 border-transparent flex-1 transition-all";
            document.getElementById('tab-active').className = tab === 'active' ? "pb-3 text-sm font-bold text-primary border-b-2 border-primary flex-1 transition-all" : "pb-3 text-sm font-bold text-gray-500 border-b-2 border-transparent flex-1 transition-all";
            renderContent();
        }

        function renderContent() {
            if (!currentRider) return;
            const container = document.getElementById('content-area');
            
            const newOrders = allOrders.filter(o => o.status === 'NEW' || o.status === 'Preparing' || (!o.deliveryPartnerId && o.status !== 'CANCELLED' && o.status !== 'Delivered'));
            const activeOrders = allOrders.filter(o => o.deliveryPartnerId === currentRider.id && o.status !== 'Delivered' && o.status !== 'CANCELLED');
            
            document.getElementById('badge-new').textContent = newOrders.length;
            document.getElementById('badge-new').classList.toggle('hidden', newOrders.length === 0);
            document.getElementById('badge-active').textContent = activeOrders.length;
            document.getElementById('badge-active').classList.toggle('hidden', activeOrders.length === 0);

            const displayData = currentTab === 'new' ? newOrders : activeOrders;
            displayData.sort((a,b) => (b.timestamp||0) - (a.timestamp||0));

            if (displayData.length === 0) {
                container.innerHTML = `
                    <div class="h-64 flex flex-col items-center justify-center text-center px-6">
                        <div class="w-16 h-16 bg-gray-200 rounded-full flex items-center justify-center text-2xl text-gray-400 mb-4">
                            <i class="fas fa-box-open"></i>
                        </div>
                        <h3 class="font-bold text-gray-800">No ${currentTab === 'new' ? 'New Requests' : 'Active Deliveries'}</h3>
                        <p class="text-sm text-gray-500 mt-1">Waiting for customer orders...</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = displayData.map(order => {
                const totalItems = (order.items || []).reduce((sum, item) => sum + (item.qty || 1), 0);
                const time = order.timestamp ? new Date(order.timestamp).toLocaleTimeString('en-IN', { hour: '2-digit', minute:'2-digit' }) : 'N/A';
                const finalTotal = order.totals ? order.totals.total : 0;

                let actionButton = '';
                if (currentTab === 'new') {
                    actionButton = `<button onclick="acceptOrder('${order.id}')" class="w-full bg-primary hover:bg-primaryDark text-white py-3.5 rounded-xl font-bold shadow-lg shadow-primary/30 transition-all text-sm mt-4 flex items-center justify-center gap-2">ACCEPT DELIVERY REQUEST <i class="fas fa-arrow-right"></i></button>`;
                } else {
                    if (order.status === 'Accepted' || order.status === 'Preparing') {
                        actionButton = `<button onclick="startDelivery('${order.id}')" class="w-full bg-purple-600 hover:bg-purple-700 text-white py-3.5 rounded-xl font-bold shadow-lg shadow-purple-600/30 transition-all text-sm mt-4 flex items-center justify-center gap-2"><i class="fas fa-location-arrow"></i> START DELIVERY & STREAM GPS</button>`;
                    } else if (order.status === 'Picked Up' || order.status === 'Out for Delivery') {
                        actionButton = `
                            <div class="space-y-2 mt-4">
                                <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(order.customer ? order.customer.address : 'Mahabubabad')}" target="_blank" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold text-xs flex items-center justify-center gap-2 shadow-md">
                                    <i class="fas fa-diamond-turn-right"></i> Open Google Maps Navigation
                                </a>
                                <button onclick="markDelivered('${order.id}')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3.5 rounded-xl font-bold shadow-lg shadow-emerald-600/30 transition-all text-sm flex items-center justify-center gap-2">
                                    <i class="fas fa-check-circle"></i> MARK ORDER DELIVERED
                                </button>
                            </div>
                        `;
                    }
                }

                return `
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-1.5 h-full ${currentTab === 'new' ? 'bg-primary' : 'bg-secondary'}"></div>
                    
                    <div class="flex justify-between items-start mb-3 pl-2">
                        <div>
                            <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Order #${order.orderId}</span>
                            <h3 class="font-extrabold text-gray-900 text-lg leading-tight mt-0.5">₹${finalTotal.toFixed(2)}</h3>
                        </div>
                        <div class="text-right">
                            <span class="bg-gray-100 text-gray-600 px-2 py-1 rounded text-xs font-bold"><i class="far fa-clock"></i> ${time}</span>
                            <div class="text-[10px] font-bold text-gray-500 mt-1 uppercase">${order.payment || 'COD'}</div>
                        </div>
                    </div>

                    <div class="bg-gray-50 rounded-xl p-3 border border-gray-100 mb-3 pl-2 ml-2">
                        <div class="flex items-start gap-3">
                            <div class="mt-1 text-primary"><i class="fas fa-map-marker-alt"></i></div>
                            <div>
                                <div class="font-bold text-sm text-gray-900">${order.customer ? order.customer.name : 'Customer'}</div>
                                <div class="text-xs text-gray-500 mt-0.5 leading-relaxed">${order.customer ? order.customer.address : 'N/A'}</div>
                                <a href="tel:${order.customer ? order.customer.phone : ''}" class="inline-flex items-center gap-1.5 text-primary text-xs font-bold mt-2 bg-primary/10 px-2.5 py-1 rounded-lg"><i class="fas fa-phone-alt"></i> Call Customer (${order.customer ? order.customer.phone : ''})</a>
                            </div>
                        </div>
                    </div>

                    <div class="flex justify-between items-center text-xs text-gray-500 pl-2">
                        <span><i class="fas fa-shopping-basket mr-1"></i> ${totalItems} Items to deliver</span>
                        <span class="font-bold bg-gray-100 px-2 py-0.5 rounded border border-gray-200">Status: ${order.status}</span>
                    </div>

                    ${actionButton}
                </div>
                `;
            }).join('');
        }

        window.acceptOrder = async function(orderId) {
            if (!currentRider) return;
            try {
                const orderRef = doc(db, 'artifacts', app_id, 'public', 'data', 'orders', orderId);
                await updateDoc(orderRef, {
                    status: 'Accepted',
                    deliveryPartnerId: currentRider.id,
                    updatedAt: Date.now()
                });
                showToast("Order Accepted!", "success");
                switchTab('active');
            } catch(e) {
                console.error(e);
                showToast("Failed to accept order.", "error");
            }
        }

        window.startDelivery = async function(orderId) {
            try {
                const orderRef = doc(db, 'artifacts', app_id, 'public', 'data', 'orders', orderId);
                await updateDoc(orderRef, {
                    status: 'Out for Delivery',
                    updatedAt: Date.now()
                });
                showToast("Delivery Started! Sharing Live GPS Telemetry.", "success");
                startLocationTracking(orderId);
                renderContent();
            } catch(e) {
                console.error(e);
                showToast("Could not start delivery.", "error");
            }
        }

        window.markDelivered = async function(orderId) {
            try {
                const orderRef = doc(db, 'artifacts', app_id, 'public', 'data', 'orders', orderId);
                await updateDoc(orderRef, {
                    status: 'Delivered',
                    updatedAt: Date.now()
                });
                stopLocationTracking();
                showToast("Order Marked Delivered!", "success");
                switchTab('new');
            } catch(e) {
                console.error(e);
                showToast("Failed to mark order delivered.", "error");
            }
        }

        function startLocationTracking(orderId) {
            if (!navigator.geolocation) {
                showToast("GPS not supported on this device", "error");
                return;
            }
            
            activeTrackingOrderId = orderId;
            
            watchId = navigator.geolocation.watchPosition(async (position) => {
                if (!activeTrackingOrderId) return;
                
                const { latitude, longitude, accuracy } = position.coords;

                try {
                    const orderRef = doc(db, 'artifacts', app_id, 'public', 'data', 'orders', activeTrackingOrderId);
                    await updateDoc(orderRef, {
                        partnerLocation: { lat: latitude, lng: longitude, updated: Date.now() }
                    });
                } catch(e) {
                    console.error("GPS Sync Error:", e);
                }
            }, (err) => {
                console.error("GPS Watch Error:", err);
            }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 5000 });
        }

        function stopLocationTracking() {
            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            activeTrackingOrderId = null;
        }

        window.addEventListener('DOMContentLoaded', () => {
            checkSession();
        });
    </script>
</body>
</html>
